name: Generate Snake
 
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
 
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-purple.svg?color_snake=#c77dff&color_dots=#1a0b2e,#3c096c,#5a189a,#9d4edd,#e0aaff
 
      - uses: crazy-max/github-pages-deploy-action@v4
        with:
          branch: output
          folder: dist
